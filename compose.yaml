services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forgequeue
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: forgequeue
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgequeue"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
